# Build test/hello.exe into a native macOS ARM64 executable on an
# Apple-silicon GitHub runner, execute it, and verify stdout + exit code.
name: macos-arm64

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify-macos-arm64:
    runs-on: macos-14          # Apple silicon (arm64)
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Host information
        run: |
          uname -a
          sw_vers
          sysctl -n machdep.cpu.brand_string
          cc --version
          python3 --version

      - name: Install dependencies
        run: |
          python3 -m pip install capstone==5.0.3
          python3 -c "import capstone; print('capstone', capstone.__version__)"
          # GNU objdump is only needed by the legacy objdump-frontend tests;
          # the translator itself uses Capstone.
          brew install binutils
          BU="$(brew --prefix binutils)/bin"
          if "$BU/objdump" -i 2>/dev/null | grep -q pei-x86-64; then
            echo "$BU" >> "$GITHUB_PATH"
            echo "GNU objdump with pei-x86-64 support: $BU/objdump"
          else
            echo "::warning::Homebrew binutils lacks pei-x86-64; legacy objdump tests will be skipped"
          fi

      - name: Build, run and verify hello.exe (stdout byte-for-byte, exit code 7, full test suite)
        run: |
          set -o pipefail
          sh scripts/verify_macos_arm64.sh 2>&1 | tee verify.log

      - name: Inspect the native executable
        if: always()
        run: |
          file build/hello || true
          lipo -archs build/hello || true
          otool -L build/hello || true
          echo "--- stdout (hex):"; xxd build/hello.stdout || true
          echo "--- stderr:"; cat build/hello.stderr || true

      - name: Package .app and .dmg, then smoke-test from the mounted image
        id: package
        run: |
          set -euo pipefail
          python3 -m recompiler doctor
          python3 -m recompiler package test/hello.exe -o dist --name Hello
          codesign --verify --deep --strict --verbose=2 dist/Hello.app
          codesign -dv dist/Hello.app 2>&1 | grep -E "Signature|Identifier|Format"
          hdiutil imageinfo dist/Hello.dmg | grep -E "^Format:"
          mnt="$(mktemp -d)"
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" dist/Hello.dmg
          trap 'hdiutil detach "$mnt" || true' EXIT
          ls -la "$mnt"
          set +e
          EXE2MAC_DIRECT=1 "$mnt/Hello.app/Contents/MacOS/hello" > dist/smoke.stdout 2> dist/smoke.stderr
          code=$?
          set -e
          same=MISMATCH; cmp -s dist/smoke.stdout test/golden/hello.stdout && same=MATCH
          echo "smoke: exit=$code stdout=$same stderr_bytes=$(wc -c < dist/smoke.stderr | tr -d ' ')" | tee dist/smoke.txt
          [ "$code" -eq 7 ] && [ "$same" = MATCH ] && [ ! -s dist/smoke.stderr ]

      - name: Publish key results as annotations
        if: always()
        run: |
          note() { echo "::notice title=$1::$2"; }
          note host "$(uname -sm) | macOS $(sw_vers -productVersion) | $(sysctl -n machdep.cpu.brand_string)"
          note binary "$(file -b build/hello 2>&1)"
          note run "$(grep -E '^exit code:' verify.log) | $(grep -E '^stdout:' verify.log) | stderr bytes=$(wc -c < build/hello.stderr | tr -d ' ')"
          note stdout-sha256 "translated=$(shasum -a 256 < build/hello.stdout | cut -c1-16) golden=$(shasum -a 256 < test/golden/hello.stdout | cut -c1-16) bytes=$(wc -c < build/hello.stdout | tr -d ' ')"
          note tests "$(grep -E '^Ran [0-9]+ tests' verify.log | tail -1) -> $(grep -E '^(OK|FAILED)' verify.log | tail -1)"
          grep -E '\.\.\. skipped' verify.log | head -10 | while IFS= read -r l; do note skipped "$l"; done || true
          awk '/^(FAIL|ERROR): /{p=1;n=0} p{print; if(++n>=30){p=0}}' verify.log > failures.txt || true
          if [ -s failures.txt ]; then
            note test-failures "$(head -c 3500 failures.txt | tr '\n' '|' )"
          fi
          note package-smoke "$(cat dist/smoke.txt 2>/dev/null || echo 'not run') | dmg=$(ls -l dist/Hello.dmg 2>/dev/null | awk '{print $5}') bytes | $(codesign -dv dist/Hello.app 2>&1 | grep -E '^Signature=' || echo 'unsigned')"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-results
          path: |
            verify.log
            build/
            dist/Hello.dmg
            dist/smoke.*

  # Reference run of the ORIGINAL hello.exe on Windows: confirms that the
  # source-derived golden file matches what real Windows produces.
  windows-reference:
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Run the original hello.exe and compare with the golden file
        run: |
          set +e
          ./test/hello.exe > win.stdout 2> win.stderr
          code=$?
          set -e
          same=MISMATCH; cmp -s win.stdout test/golden/hello.stdout && same=MATCH
          ver="$(cmd.exe /c ver | tr -d '\r' | tr -s '\n' ' ')"
          echo "::notice title=windows-reference::host=$ver $(uname -m) | exit=$code | stdout=$same | bytes=$(wc -c < win.stdout | tr -d ' ') | sha256=$(sha256sum < win.stdout | cut -c1-16) | stderr_bytes=$(wc -c < win.stderr | tr -d ' ')"
          od -c win.stdout | head -20
          [ "$code" -eq 7 ] && [ "$same" = MATCH ]
